<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 576" role="img" aria-label="Four crypto decisions in the Week 3 lab, each shown as a misuse on the left and its fix on the right. Decision one, password storage: vulnerable_crypto.py calls hashlib.md5 on the password with no salt, which is fast and GPU-friendly, so hashcat -m 0 cracks every hash in hashes.txt; that is CWE-916 and CWE-327. The fix raises the cost per guess by using argon2id through ph.hash, a memory-hard key derivation function with a per-hash salt, and rehashing legacy MD5 records on login. Decision two, cipher mode: AES.new with HARDCODED_KEY in MODE_ECB means the same plaintext block always produces the same ciphertext block and there is no authentication tag, so edits go undetected; that is CWE-327. The fix adds integrity by using AES.new with the key in MODE_GCM, a random twelve-byte nonce and an authentication tag, so flipping one ciphertext byte makes decryption fail. Decision three, random numbers: random.choice over the digits builds a six-digit reset_token with only ten to the sixth possibilities from the Mersenne Twister, whose internal state leaks from its own output; that is CWE-330. The fix makes tokens unguessable with secrets.token_urlsafe, a CSPRNG drawing on operating-system entropy with no recoverable internal state. Decision four, key source: HARDCODED_KEY equals the literal bytes 0123456789abcdef, committed to git and identical in every copy, so one leak breaks all installs; that is CWE-798. The fix injects the key at runtime from os.environ ENC_KEY_HEX, an environment variable or key management service, so the key can be rotated without a code change. The overall lesson: one cipher name answers none of these four questions, and AES-GCM under a hardcoded key is still CWE-798.">
<title>Four crypto misuses and their fixes: KDF, cipher mode, randomness and key source are separate decisions</title>
