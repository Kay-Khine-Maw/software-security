<rect class="bg" x="0" y="0" width="720" height="600"/>

<text class="h1"  x="24" y="30">Fail closed, or fail open by accident</text>
<text class="sub" x="24" y="49">The same yes-or-no question, asked at two different times</text>

<!-- ===================== LEFT PANEL : BUILD TIME ===================== -->
<rect class="panel" x="24" y="68" width="280" height="396" rx="8"/>

<text class="pnum" x="40" y="88">BUILD TIME</text>
<text class="pt"   x="40" y="107">The CI gate</text>
<text class="ps"   x="40" y="123">security-ci.yml · on: pull_request</text>

<rect class="node" x="40" y="136" width="248" height="26" rx="5"/>
<text class="nt" x="164" y="153" text-anchor="middle">Pull request opened</text>

<line class="arrow" x1="164" y1="162" x2="164" y2="171"/>
<polygon class="ahead" points="158.5,170 169.5,170 164,177"/>

<rect class="node" x="40"  y="178" width="80" height="42" rx="5"/>
<rect class="node" x="124" y="178" width="80" height="42" rx="5"/>
<rect class="node" x="208" y="178" width="80" height="42" rx="5"/>
<text class="chipt" x="80"  y="198" text-anchor="middle">Semgrep</text>
<text class="chips" x="80"  y="212" text-anchor="middle">SAST</text>
<text class="chipt" x="164" y="198" text-anchor="middle">Trivy</text>
<text class="chips" x="164" y="212" text-anchor="middle">SCA + IaC</text>
<text class="chipt" x="248" y="198" text-anchor="middle">Gitleaks</text>
<text class="chips" x="248" y="212" text-anchor="middle">secrets</text>

<line class="arrow" x1="52" y1="224" x2="52" y2="238"/>
<polygon class="ahead" points="46.5,237 57.5,237 52,244"/>
<text class="alab" x="64" y="232">1 · report run: exit-code "0"</text>
<text class="alab" x="64" y="245">SARIF uploads even when the gate fails</text>

<rect class="gate" x="40" y="250" width="248" height="72" rx="6"/>
<text class="gt"       x="52" y="270">2 · Gate step: exit-code: "1"</text>
<text class="gm mono"  x="52" y="288">Trivy  severity: HIGH,CRITICAL</text>
<text class="gs"       x="52" y="303">Semgrep --error and Gitleaks: no</text>
<text class="gs"       x="52" y="316">severity filter — any finding fails.</text>

<line class="arrow" x1="100" y1="322" x2="100" y2="335"/>
<polygon class="ahead" points="94.5,334 105.5,334 100,341"/>
<line class="arrow" x1="228" y1="322" x2="228" y2="335"/>
<polygon class="ahead" points="222.5,334 233.5,334 228,341"/>

<rect class="ok"  x="40"  y="342" width="120" height="76" rx="6"/>
<rect class="bad" x="168" y="342" width="120" height="76" rx="6"/>

<polyline class="tick" points="50,363 55,368 63,358"/>
<text class="oklbl"    x="70" y="367">CAUGHT</text>
<text class="code mono" x="50" y="385">USER root</text>
<text class="body"      x="50" y="399">DS-0002 HIGH</text>
<text class="okbig"     x="50" y="414">BUILD FAILS</text>

<line class="cross" x1="178" y1="359" x2="187" y2="368"/>
<line class="cross" x1="187" y1="359" x2="178" y2="368"/>
<text class="bdlbl"     x="195" y="367">SLIPS PAST</text>
<text class="code mono" x="178" y="385">FROM …:latest</text>
<text class="body"      x="178" y="399">DS-0001 MEDIUM</text>
<text class="bdbig"     x="178" y="414">BUILD PASSES</text>

<text class="note" x="40" y="438">The threshold, not the scanner, decides</text>
<text class="note" x="40" y="452">what this build is willing to refuse.</text>

<!-- ===================== RIGHT PANEL : RUN TIME ===================== -->
<rect class="panel" x="320" y="68" width="376" height="396" rx="8"/>

<text class="pnum" x="336" y="88">RUN TIME</text>
<text class="pt"   x="336" y="107">The /admin handler</text>
<text class="ps"   x="336" y="123">GET /admin — no Authorization header</text>

<rect class="bad" x="334" y="132" width="348" height="130" rx="6"/>
<text class="hdo"       x="346" y="152">FAIL OPEN</text>
<text class="file mono" x="424" y="152">insecure_service.py  :8090</text>
<text class="code mono" x="346" y="172">user = USERS[token]        # raises KeyError</text>
<text class="code mono" x="346" y="188">except Exception:</text>
<text class="code mono" x="346" y="204">  return jsonify(panel="UNLOCKED", secret=SECRET)</text>
<text class="obso mono" x="346" y="222">200 {"panel":"UNLOCKED",</text>
<text class="obso mono" x="346" y="236">     "secret":"FLAG{devsecops_…}"}</text>
<text class="body"      x="346" y="254">Nothing is logged — the bypass is silent (A09).</text>

<text class="alab" x="508" y="279" text-anchor="middle">same try / except — one different return</text>

<rect class="ok" x="334" y="287" width="348" height="162" rx="6"/>
<text class="hdb"       x="346" y="307">FAIL CLOSED</text>
<text class="file mono" x="442" y="307">secure_service.py  :8091</text>
<text class="code mono" x="346" y="327">user = USERS.get(token)    # None, never raises</text>
<text class="code mono" x="346" y="343">except Exception as exc:</text>
<text class="code mono" x="346" y="359">  return jsonify(error="forbidden"), 403</text>
<text class="obsb mono"  x="346" y="379">403 {"error":"forbidden"}</text>
<text class="codeg mono" x="346" y="393">event=authz_failure  reason=unauthenticated</text>
<text class="codeg mono" x="346" y="407">except path → event=authz_error error=&lt;type&gt;</text>
<text class="body" x="346" y="427">Every path denies. The except logs the error type,</text>
<text class="body" x="346" y="441">not the message (CWE-209) or the token (CWE-532).</text>

<!-- ===================== THE TIE ===================== -->
<line class="arrow" x1="164" y1="464" x2="164" y2="482"/>
<line class="arrow" x1="508" y1="464" x2="508" y2="482"/>

<rect class="strip" x="24" y="482" width="672" height="94" rx="8"/>
<text class="st" x="44"  y="510">One decision, made twice — and both defaults are yes.</text>
<text class="sb" x="44"  y="533">The gate exits 0 for anything</text>
<text class="sb" x="44"  y="548">it was not told to fail on.</text>
<text class="sb" x="376" y="533">The handler returns 200 for</text>
<text class="sb" x="376" y="548">anything that threw.</text>
<text class="tag" x="44" y="569">Nobody chose. That default is A10 / CWE-636 — fail open.</text>
</svg>
