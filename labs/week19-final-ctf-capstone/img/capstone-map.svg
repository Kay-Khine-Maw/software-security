<!-- Title -->
<text x="360" y="30" text-anchor="middle" class="title">Week 19 Capstone: CTF Categories → Project Demo Pipeline</text>
<text x="360" y="46" text-anchor="middle" class="subtitle">Two things get graded — CTF live, project async + live Q&amp;A.</text>

<!-- Left header -->
<text x="20" y="72" class="header">CTF TOURNAMENT</text>
<rect x="235" y="58" width="90" height="22" rx="11" class="pill"/>
<text x="280" y="73" text-anchor="middle" class="pillText">150 PTS</text>
<text x="20" y="86" class="subhead">150 min · whole term · team-based · leaderboard</text>

<!-- Right header -->
<text x="400" y="72" class="header">PROJECT DEMO PIPELINE</text>
<text x="400" y="86" class="subhead">recorded walkthrough, graded on the rubric</text>

<!-- Funnel connecting all CTF categories to Vulnerabilities-found + Remediation -->
<polygon points="330,100 400,168 400,286 330,498" class="funnel"/>
<polygon points="400,227 388,220 388,234" class="arrowHeadOrange"/>
<text x="365" y="203" text-anchor="middle" class="funnelCaption">FOR REAL</text>

<!-- ===================== LEFT: CTF categories ===================== -->

<!-- Row 0: Web exploitation (highest weight) -->
<rect x="20" y="100" width="310" height="58" rx="6" class="cardOrange"/>
<text x="30" y="116" class="name">Web exploitation</text>
<text x="30" y="130" class="sub">SQLi · cmd injection · XSS · IDOR · JWT forge (wk04–06)</text>
<rect x="30" y="140" width="200" height="8" rx="2" class="barOrange"/>
<text x="320" y="116" text-anchor="end" class="ptsHi">60 pts</text>

<!-- Row 1: API abuse -->
<rect x="20" y="168" width="310" height="58" rx="6" class="cardBlue"/>
<text x="30" y="184" class="name">API abuse</text>
<text x="30" y="198" class="sub">BOLA + mass assignment (wk10)</text>
<rect x="30" y="208" width="50" height="8" rx="2" class="barBlue"/>
<text x="320" y="184" text-anchor="end" class="pts">15 pts</text>

<!-- Row 2: Memory safety -->
<rect x="20" y="236" width="310" height="58" rx="6" class="cardBlue"/>
<text x="30" y="252" class="name">Memory safety</text>
<text x="30" y="266" class="sub">Stack overflow → ret2win · fuzzing (wk11)</text>
<rect x="30" y="276" width="100" height="8" rx="2" class="barBlue"/>
<text x="320" y="252" text-anchor="end" class="pts">30 pts</text>

<!-- Row 3: Supply chain -->
<rect x="20" y="304" width="310" height="58" rx="6" class="cardBlue"/>
<text x="30" y="320" class="name">Supply chain</text>
<text x="30" y="334" class="sub">Vulnerable dependency / unsigned image (wk12)</text>
<rect x="30" y="344" width="33" height="8" rx="2" class="barBlue"/>
<text x="320" y="320" text-anchor="end" class="pts">10 pts</text>

<!-- Row 4: Cloud -->
<rect x="20" y="372" width="310" height="58" rx="6" class="cardBlue"/>
<text x="30" y="388" class="name">Cloud</text>
<text x="30" y="402" class="sub">Exposed secret · open IAM · root Dockerfile (wk13)</text>
<rect x="30" y="412" width="50" height="8" rx="2" class="barBlue"/>
<text x="320" y="388" text-anchor="end" class="pts">15 pts</text>

<!-- Row 5: LLM and agentic -->
<rect x="20" y="440" width="310" height="58" rx="6" class="cardBlue"/>
<text x="30" y="456" class="name">LLM &amp; agentic</text>
<text x="30" y="470" class="sub">Prompt injection · indirect injection/XSS (wk14)</text>
<rect x="30" y="480" width="67" height="8" rx="2" class="barBlue"/>
<text x="320" y="456" text-anchor="end" class="pts">20 pts</text>

<!-- ===================== RIGHT: project demo pipeline ===================== -->

<!-- Stage 1: Threat model -->
<rect x="400" y="100" width="300" height="50" rx="6" class="cardBlue"/>
<circle cx="418" cy="125" r="13" class="circleBlue"/>
<text x="418" y="129" text-anchor="middle" class="stepNum">1</text>
<text x="440" y="121" class="stepTitle">Threat model</text>
<text x="440" y="136" class="stepSub">attack surface, STRIDE-style</text>
<polygon points="550,150 544,163 556,163" class="arrowHead"/>

<!-- Stage 2: Vulnerabilities found -->
<rect x="400" y="168" width="300" height="50" rx="6" class="cardBlue"/>
<circle cx="418" cy="193" r="13" class="circleBlue"/>
<text x="418" y="197" text-anchor="middle" class="stepNum">2</text>
<text x="440" y="189" class="stepTitle">Vulnerabilities found</text>
<text x="440" y="204" class="stepSub">CWE / OWASP mapped</text>
<polygon points="550,218 544,231 556,231" class="arrowHead"/>

<!-- Stage 3: Remediation -->
<rect x="400" y="236" width="300" height="50" rx="6" class="cardBlue"/>
<circle cx="418" cy="261" r="13" class="circleBlue"/>
<text x="418" y="265" text-anchor="middle" class="stepNum">3</text>
<text x="440" y="257" class="stepTitle">Remediation</text>
<text x="440" y="272" class="stepSub">fixed code, re-tested</text>
<polygon points="550,286 544,299 556,299" class="arrowHead"/>

<!-- Stage 4: SBOM + signed artifact -->
<rect x="400" y="304" width="300" height="50" rx="6" class="cardBlue"/>
<circle cx="418" cy="329" r="13" class="circleBlue"/>
<text x="418" y="333" text-anchor="middle" class="stepNum">4</text>
<text x="440" y="325" class="stepTitle">SBOM + signed artifact</text>
<text x="440" y="340" class="stepSub">supply-chain provenance</text>
<polygon points="550,354 544,367 556,367" class="arrowHead"/>

<!-- Stage 5: Security CI/CD pipeline -->
<rect x="400" y="372" width="300" height="50" rx="6" class="cardBlue"/>
<circle cx="418" cy="397" r="13" class="circleBlue"/>
<text x="418" y="401" text-anchor="middle" class="stepNum">5</text>
<text x="440" y="393" class="stepTitle">Security CI/CD pipeline</text>
<text x="440" y="408" class="stepSub">automated gates</text>
<polygon points="550,422 544,435 556,435" class="arrowHead"/>

<!-- Stage 6: Video walkthrough (graded, async) -->
<rect x="400" y="440" width="300" height="50" rx="6" class="cardOrange"/>
<circle cx="418" cy="465" r="13" class="circleOrange"/>
<text x="418" y="469" text-anchor="middle" class="stepNum">6</text>
<text x="440" y="461" class="stepTitle">Video walkthrough</text>
<text x="440" y="476" class="stepSubHi">graded async on rubric</text>
<polygon points="550,490 544,503 556,503" class="arrowHead"/>

<!-- Stage 7: Live Q&A (viva-style) -->
<rect x="400" y="508" width="300" height="50" rx="6" class="cardBlue"/>
<circle cx="418" cy="533" r="13" class="circleBlue"/>
<text x="418" y="537" text-anchor="middle" class="stepNum">7</text>
<text x="440" y="529" class="stepTitle">Live Q&amp;A — 3 min</text>
<text x="440" y="544" class="stepSub">viva-style, not a re-demo</text>

<!-- ===================== Footer ===================== -->
<text x="360" y="586" text-anchor="middle" class="footer">Each CTF submission = flag + payload + mitigation.</text>
<text x="360" y="600" text-anchor="middle" class="footer">Found → proved → fixed — same 3 moves the pipeline grades.</text>
<text x="360" y="614" text-anchor="middle" class="footer">Not a toy target this time: the stakes are your own system.</text>

</svg>
