<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 650" role="img" aria-label="Diagram mapping Week 19's two graded components. Left half: the capstone CTF tournament, 150 points total across six categories drawn from the whole term. Web exploitation covers SQL injection, command injection, stored XSS, IDOR and JWT forgery, worth 60 points, from weeks 4 to 6. API abuse covers BOLA and mass assignment, worth 15 points, from week 10. Memory safety covers a stack overflow ret2win exploit and fuzzing, worth 30 points, from week 11. Supply chain covers finding a vulnerable dependency or unsigned image, worth 10 points, from week 12. Cloud covers an exposed secret, open IAM policy or root Dockerfile, worth 15 points, from week 13. LLM and agentic covers prompt injection and indirect injection, worth 20 points, from week 14. Right half: the term project demo pipeline, a seven-step left-to-right chain — threat model, vulnerabilities found, remediation, SBOM plus signed artifact, security CI/CD pipeline, a recorded video walkthrough submitted before the session and graded asynchronously on the rubric, and a three-minute live Q&amp;A, viva-style rather than a re-demo, to confirm the work is the team's own. A funnel shape connects all six CTF categories to the vulnerabilities-found and remediation steps of the pipeline, captioned 'for real', making the point that every CTF submission's flag, payload and one-line mitigation are the same find-and-fix moves the project had to perform for real, once, against the team's own system rather than a toy target.">
<title>Week 19 capstone map: CTF tournament categories versus the project demo pipeline</title>
