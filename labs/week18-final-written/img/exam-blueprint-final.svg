<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 550" role="img" aria-label="Exam blueprint for the Week 18 cumulative final. A thin foundation band across Weeks 1 to 6 covers threat modeling, SDLC and tooling, cryptography, injection, cross-site scripting, and authentication and authorization, at lighter weight. Weeks 7 to 9, the midterm content, are folded into scope without a dedicated block. A wide emphasis band across Weeks 10 to 15 carries most of the exam weight: API security with BOLA, mass assignment and rate limits; memory safety and exploitation; supply-chain integrity with SLSA, SBOM and Cosign; cloud and container least-privilege IAM; AI and LLM prompt injection; and DevSecOps fail-closed gate design. Week 16, the capstone studio, is not examinable. The exam is 150 minutes and 100 points across four sections: Section A, 30 points, modern-stack concepts spanning the whole term; Section B, 20 points, spot-the-vulnerability naming and fixing four code snippets; Section C, 30 points, applied design with no exploit payload required; Section D, 20 points, DevSecOps pipeline and supply-chain incident design. Fifty points test recall and identification, fifty points test design reasoning. Unlike Week 8's midterm, which devoted 30 of 100 points to writing an actual SQL injection payload, Week 18 requires zero points of payload-writing — the shift is from writing exploits to designing fixes and pipelines.">
<title>Week 18 Final Exam Blueprint</title>
