<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 836" role="img" aria-label="The same Week 13 app shipped twice, as two stacked container images side by side, with a label rail between them naming the concern and the CWE. The left stack is Dockerfile.insecure, the right stack is Dockerfile.hardened. Six image layers are compared. One, base image tag, CWE-1104 and CWE-16: insecure uses FROM python colon latest, a mutable tag, and Trivy config flags it as DS-0001; hardened uses FROM python 3.11-slim pinned by an at sha256 digest in a multi-stage build whose build stage is thrown away, so the same bytes come out of every rebuild. Two, baked-in secret, CWE-798 and CWE-200: insecure sets ENV API_TOKEN equals sk_live_supersecret, which docker history prints back, and Trivy flags it as DS-0031; hardened has no ENV secret in any layer, AWS_SECRET_ACCESS_KEY is gone too, and the value is injected at runtime instead. Three, runtime user, CWE-250: insecure has no USER directive so the container runs as uid 0, meaning remote code execution or a container escape starts as root, and Trivy flags it as DS-0002; hardened sets USER 65532 colon 65532, the distroless nonroot user, so an escape lands unprivileged. Four, build context, CWE-538: insecure runs COPY dot dot, dragging .git, .env, keys and CI files into the image, and there is no Trivy rule for it, you find it only by reading the file; hardened copies only app.py plus a .dockerignore. Five, directory permissions, CWE-732: insecure runs chmod -R 777 on slash app so any process in the container can rewrite the code, and again there is no Trivy rule; hardened keeps default permissions that are not world-writable and adds the runtime flags --read-only and --cap-drop ALL. Six, dependency install, CWE-1104: insecure runs pip install -r requirements.txt unpinned, as root, with no --no-cache-dir, and there is no Trivy rule; hardened builds a venv in a discarded build stage and copies it into a distroless runtime that ships neither pip nor a shell. Below the two images, the same argument one layer up in the cloud control plane: iam-policy-insecure.json grants Action star on Resource star with no Condition, which equals full AWS admin and which trivy config does not flag because it does not parse bare IAM JSON; iam-policy-leastpriv.json allows only s3:GetObject on arn:aws:s3:::lab-app-bucket/app/star plus a Condition on s3:prefix equals app slash star, that is one action, one prefix, one condition. The conclusion: trivy config flags three rows only, DS-0001 the unpinned tag, DS-0002 the root user and DS-0031 the secret in ENV. COPY dot dot, chmod 777, the unpinned pip install and the IAM JSON have no rule at all. Task 1 grades exactly that split: cite the rule ID where one exists, or write manual review, no Trivy rule.">
<title>Same app shipped twice — and the scanner only sees three of the seven defects</title>
