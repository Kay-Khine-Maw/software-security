services:
  vulnerable-chatbot:
    image: python:3.12-slim
    working_dir: /lab
    volumes:
      - ./:/lab
    ports:
      - "8082:8082"
    # Per-student flags: python3 ../../instructor/seed_flags.py env <STUDENT_ID> > .env
    environment:
      - FLAG_PROMPTINJ
    command: >
      bash -c "pip install --no-cache-dir flask &&
               echo '--- INSECURE chatbot on :8082 — open http://localhost:8082 — see attack.md ---' &&
               python vulnerable_chatbot.py"

  guarded-chatbot:
    image: python:3.12-slim
    working_dir: /lab
    volumes:
      - ./:/lab
    ports:
      - "8083:8083"
    # Per-student flags: python3 ../../instructor/seed_flags.py env <STUDENT_ID> > .env
    environment:
      - FLAG_PROMPTINJ
    command: >
      bash -c "pip install --no-cache-dir flask &&
               echo '--- GUARDED chatbot on :8083 — open http://localhost:8083 ---' &&
               python guarded_chatbot.py"
