<defs>
  <marker id="hg" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9.5" refY="5" orient="auto">
    <path class="mkg" d="M0,0.6 L9.5,5 L0,9.4 Z"/>
  </marker>
  <marker id="ho" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9.5" refY="5" orient="auto">
    <path class="mko" d="M0,0.6 L9.5,5 L0,9.4 Z"/>
  </marker>
